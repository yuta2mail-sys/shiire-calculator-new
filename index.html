<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="古物利益計算PRO">
<link rel="manifest" href="manifest.json">
<title>せっかちマウスの古物利益計算PRO</title>
<style>
:root{--ink:#172033;--muted:#64748b;--line:#dbe2ea;--paper:#f4f6f9;--blue:#2563eb;--green:#16834a;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
main{max-width:650px;margin:auto;padding:16px 14px 38px}
header{padding:8px 4px 16px}
.brand{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
h1{font-size:23px;line-height:1.25;margin:5px 0 4px;font-weight:900}
.subtitle{font-size:12px;color:var(--muted)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 8px;font-size:14px;font-weight:800;color:var(--muted)}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.panel[hidden]{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;margin:0 0 12px}
.card h2{font-size:16px;margin:0 0 13px}
.card h3{font-size:14px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field{min-width:0}
label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:#334155}
input,select{width:100%;min-height:45px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:3px solid #dbeafe;border-color:var(--blue)}
small,.help{font-size:11px;color:var(--muted);line-height:1.55}
.help{margin-top:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{border:0;border-radius:10px;padding:11px 13px;font-size:13px;font-weight:800;background:#e8edf4;color:var(--ink)}
button.primary{background:var(--blue);color:#fff}
button.dark{background:var(--ink);color:#fff}
button.danger{background:#fff0ef;color:var(--red)}
button:active{transform:scale(.99)}
.result{background:#eef5ff;border:1px solid #bfd7ff;border-radius:16px;padding:17px;margin:12px 0;text-align:center}
.result .caption{font-size:12px;color:#52647d;font-weight:800}
.big{font-size:30px;line-height:1.25;font-weight:900;margin:5px 0}
.green{color:var(--green)}.red{color:var(--red)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;text-align:left}
.stat span{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}
.stat strong{font-size:16px}
.buyer{border:1px solid var(--line);border-radius:13px;padding:12px;margin:10px 0;background:#fbfcfe}
.buyerhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.buyerhead strong{font-size:14px}
.rank{font-size:10px;font-weight:900;padding:4px 7px;border-radius:20px;background:#e8edf4;color:#475569}
.rank.best{background:#dcfce7;color:#166534}
.buyergrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.netline{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:12px}
.netline strong{font-size:18px}
.presetline{display:grid;grid-template-columns:1fr 90px auto;gap:7px;align-items:end;margin-top:8px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.note{background:#fff8e8;border:1px solid #f4dfaa;padding:11px;border-radius:11px;font-size:11px;color:#75551b;line-height:1.6}
.footer{text-align:center;color:var(--muted);font-size:10px;padding:15px 5px}
@media(max-width:390px){main{padding-left:11px;padding-right:11px}.grid3{grid-template-columns:1fr 1fr}.big{font-size:27px}.buyergrid{gap:7px}}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">🐭 せっかちマウスの</div>
    <h1>古物利益計算 PRO</h1>
    <div class="subtitle">仕入れ判断を、もっと速く・正確に。</div>
  </header>

  <div class="effect-row">
    <span>🐭 せっかちマウス演出</span>
    <label class="switch">
      <input id="effectToggle" type="checkbox" checked>
      <span class="slider"></span>
    </label>
    <strong id="effectState">ON</strong>
  </div>

  <section class="card">
    <div class="field">
      <label for="gCost">仕入れ値（円）</label>
      <input id="gCost" type="number" inputmode="numeric" min="0" placeholder="例：10,000">
    </div>

    <div class="fee-row">
      <div class="field">
        <label for="gBuyRate">仕入れ手数料（%）</label>
        <input id="gBuyRate" type="number" inputmode="decimal" min="0" step="0.1" value="8">
      </div>
      <div class="fee-display">
        <span>手数料</span>
        <strong id="gBuyFee">0円</strong>
      </div>
    </div>

    <div class="field">
      <label for="gSale">販売価格（円）</label>
      <input id="gSale" type="number" inputmode="numeric" min="0" placeholder="例：20,000">
    </div>

    <div class="fee-row">
      <div class="field">
        <label for="gSellRate">販売手数料（%）</label>
        <input id="gSellRate" type="number" inputmode="decimal" min="0" step="0.1" value="10">
      </div>
      <div class="fee-display">
        <span>手数料</span>
        <strong id="gSellFee">0円</strong>
      </div>
    </div>

    <div class="field">
      <label for="gShipping">送料（円）</label>
      <input id="gShipping" type="number" inputmode="numeric" min="0" value="1000">
    </div>
  </section>

  <section class="result" id="resultBox">
    <div class="caption">今回の利益</div>
    <div class="big" id="gProfit">＋0円</div>
    <div class="formula">販売価格 − 仕入れ値 − 仕入れ手数料 − 販売手数料 − 送料</div>
  </section>

  <div id="mascotStage" aria-live="polite"></div>

  <div class="breakdown" id="breakdown">
    <div><span>仕入れ合計</span><strong id="totalCost">0円</strong></div>
    <div><span>販売手数料</span><strong id="breakdownSellFee">0円</strong></div>
    <div><span>送料</span><strong id="breakdownShipping">0円</strong></div>
  </div>

  <div class="footer">入力するだけで即計算。古物市場での仕入れ判断を、もっと速く。</div>
</main>

<style>
:root{
  --ink:#172033;--muted:#64748b;--line:#dbe2ea;--paper:#f4f6f9;
  --blue:#2563eb;--green:#16834a;--red:#b42318;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;
}
main{max-width:650px;margin:auto;padding:16px 14px 30px}
header{padding:8px 4px 12px}
.brand{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
h1{font-size:23px;line-height:1.25;margin:5px 0 4px;font-weight:900}
.subtitle{font-size:12px;color:var(--muted)}

.effect-row{
  display:flex;align-items:center;gap:9px;
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:11px 13px;margin-bottom:12px;font-size:13px;font-weight:800;
}
.effect-row strong{font-size:11px;color:var(--green);margin-left:auto}
.switch{position:relative;width:46px;height:27px;display:inline-block;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{
  position:absolute;inset:0;background:#cbd5e1;border-radius:30px;
  transition:.2s;cursor:pointer;
}
.slider:before{
  content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px #0002;
}
.switch input:checked + .slider{background:var(--green)}
.switch input:checked + .slider:before{transform:translateX(19px)}

.card{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:15px;margin-bottom:12px;
}
.field{min-width:0;margin-bottom:13px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:12px;font-weight:800;margin:0 0 6px;color:#334155}
input{
  width:100%;min-height:48px;padding:9px 12px;border:1px solid var(--line);
  border-radius:11px;font-size:18px;background:#fff;color:var(--ink);
  min-width:0;-webkit-appearance:none;
}
input:focus{outline:3px solid #dbeafe;border-color:var(--blue)}
.fee-row{
  display:grid;grid-template-columns:minmax(0,1fr) 130px;
  gap:9px;align-items:end;
}
.fee-display{
  min-height:48px;background:#f8fafc;border:1px solid var(--line);
  border-radius:11px;padding:8px 10px;display:flex;flex-direction:column;
  justify-content:center;margin-bottom:13px;
}
.fee-display span{font-size:10px;color:var(--muted)}
.fee-display strong{font-size:15px}

.result{
  background:#eef5ff;border:1px solid #bfd7ff;border-radius:17px;
  padding:18px 15px;margin:12px 0;text-align:center;
  transition:.2s;
}
.result.loss{background:#fff1f0;border-color:#ffc7c2}
.result.win{background:#effcf4;border-color:#b7e8c9}
.result .caption{font-size:12px;color:#52647d;font-weight:800}
.big{font-size:34px;line-height:1.25;font-weight:900;margin:4px 0}
.green{color:var(--green)}.red{color:var(--red)}
.formula{font-size:10px;color:var(--muted);line-height:1.5}

.breakdown{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;
}
.breakdown>div{
  background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:9px;text-align:center;
}
.breakdown span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}
.breakdown strong{font-size:13px}

#mascotStage{
  position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));
  width:150px;height:150px;overflow:visible;pointer-events:none;z-index:9999;
}
.mascot-toast{
  width:150px;height:150px;display:flex;align-items:center;justify-content:center;
  transform-origin:bottom left;animation:toastIn .55s cubic-bezier(.18,.9,.25,1.2) both;
}
.mascot{
  display:block;width:136px;height:136px;object-fit:contain;
  filter:drop-shadow(0 4px 5px #17203324);transform-origin:bottom center;
  animation:mouseIdle .8s ease-in-out .45s 2;
}
.mascot-toast.loss .mascot{animation:mouseWorry .22s ease-in-out .45s 5}
@keyframes toastIn{
  0%{opacity:0;transform:translate(-32px,22px) scale(.62)}
  65%{opacity:1;transform:translate(3px,-3px) scale(1.06)}
  100%{opacity:1;transform:translate(0,0) scale(1)}
}
@keyframes mouseIdle{0%,100%{transform:rotate(0) translateY(0)}35%{transform:rotate(-4deg) translateY(-5px)}70%{transform:rotate(4deg) translateY(-2px)}}
@keyframes mouseWorry{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg) translateX(-3px)}}
.mascot-toast.hide{animation:toastOut .3s ease-in forwards}
@keyframes toastOut{to{opacity:0;transform:translate(-14px,10px) scale(.9)}}
@media(max-width:390px){#mascotStage{width:145px;height:145px}.mascot-toast{width:145px;height:145px}.mascot{width:136px;height:136px}}
@media(prefers-reduced-motion:reduce){.mascot-toast,.mascot{animation:none!important}}
.footer{text-align:center;color:var(--muted);font-size:10px;padding:16px 5px}
@media(max-width:390px){
  main{padding-left:11px;padding-right:11px}
  .fee-row{grid-template-columns:minmax(0,1fr) 112px}
  .big{font-size:30px}
}
</style>

<script>
const $=id=>document.getElementById(id);
const num=id=>{
  const n=parseFloat($(id)?.value);
  return Number.isFinite(n)&&n>=0?n:0;
};
const yen=n=>Math.round(n).toLocaleString("ja-JP")+"円";

const mascotImages = {
  bakueki: "./assets/bakueki.png",
  usuri: "./assets/usuri.png",
  clear: "./assets/clear.png",
  ikioi: "./assets/ikioi.png"
};

let lastTier = null;
let effectTimer = null;

function getTier(profit){
  if(profit >= 8000) return "bakueki";
  if(profit >= 5000) return "clear";
  if(profit >= 2500) return "ikioi";
  return "usuri";
}

function showMascot(tier){
  const stage=$("mascotStage");
  stage.innerHTML="";
  if(!$("effectToggle").checked || !mascotImages[tier]) return;

  const toast=document.createElement("div");
  toast.className="mascot-toast"+(tier==="usuri"?" loss":"");
  const img=document.createElement("img");
  img.className="mascot";
  img.alt=tier==="bakueki"?"爆益！":tier==="clear"?"目標利益クリア！":tier==="ikioi"?"勢いは大事":"薄利！";
  img.src=mascotImages[tier];
  toast.appendChild(img);
  stage.appendChild(toast);

  clearTimeout(effectTimer);
  effectTimer=setTimeout(()=>{
    if(stage.firstElementChild){
      stage.firstElementChild.classList.remove("mascot-toast");
      stage.firstElementChild.classList.add("mascot-toast","hide");
      setTimeout(()=>stage.innerHTML="",330);
    }
  },2400);
}

function update(){
  const cost=num("gCost");
  const buyRate=num("gBuyRate");
  const sale=num("gSale");
  const sellRate=num("gSellRate");
  const shipping=num("gShipping");

  const buyFee=cost*buyRate/100;
  const sellFee=sale*sellRate/100;
  const profit=sale-cost-buyFee-sellFee-shipping;

  $("gBuyFee").textContent=yen(buyFee);
  $("gSellFee").textContent=yen(sellFee);
  $("totalCost").textContent=yen(cost+buyFee);
  $("breakdownSellFee").textContent=yen(sellFee);
  $("breakdownShipping").textContent=yen(shipping);

  const profitEl=$("gProfit");
  profitEl.textContent=(profit>=0?"＋":"") + yen(profit);
  profitEl.classList.toggle("green",profit>=0);
  profitEl.classList.toggle("red",profit<0);

  const box=$("resultBox");
  box.classList.toggle("win",profit>=0);
  box.classList.toggle("loss",profit<0);

  currentTier=( $("gCost").value.trim()!=="" && $("gSale").value.trim()!=="" ) ? getTier(profit) : "none";
}

let currentTier="none";
let lastShownTier="none";
const fields=["gCost","gBuyRate","gSale","gSellRate","gShipping"];
fields.forEach(id=>{
  const field=$(id);
  field.addEventListener("input",update);
  // Enter (desktop) or leaving a changed field (mobile) commits the entry.
  field.addEventListener("keydown",event=>{
    if(event.key==="Enter"){
      event.preventDefault();
      update();
      commitEffect();
      field.blur();
    }
  });
  field.addEventListener("change",()=>{
    update();
    commitEffect();
  });
});
function commitEffect(){
  if(currentTier==="none"){lastShownTier="none";return;}
  if(currentTier!==lastShownTier){
    lastShownTier=currentTier;
    showMascot(currentTier);
  }
}

$("effectToggle").addEventListener("change",()=>{
  $("effectState").textContent=$("effectToggle").checked?"ON":"OFF";
  if(!$("effectToggle").checked){
    $("mascotStage").innerHTML="";
  }else{
    lastShownTier="none";
    update();
  }
});

update();
</script>
</body>
</html>
